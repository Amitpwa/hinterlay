org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Release configuration. Leave blank while developing: Google's TEST ad IDs are
# used automatically. Put your real values here (or in ~/.gradle/gradle.properties
# so they never land in git) before building a release for Google Play.
# Debug builds ALWAYS use test ads - clicking your own live ads violates AdMob policy.
# ---------------------------------------------------------------------------
ADMOB_APP_ID=ca-app-pub-1105737854661628~7263459991
ADMOB_BANNER_ID=ca-app-pub-1105737854661628/4584316601
ADMOB_INTERSTITIAL_ID=ca-app-pub-1105737854661628/8331989927
ADMOB_REWARDED_ID=ca-app-pub-1105737854661628/5628523700
# Your own phones/emulators: they get "Test Ad" creatives from the real units (safe to tap). Comma-separated ids from logcat.
ADMOB_TEST_DEVICE_IDS=
# Needed only for the direct "Share to Instagram Story" button (Meta requirement).
FACEBOOK_APP_ID=
# Microsoft Clarity project id (clarity.microsoft.com > project settings). Blank = Clarity off.
CLARITY_PROJECT_ID=ytzcm0q79d
# Your PayPal.Me link, e.g. https://www.paypal.me/yourname . Blank hides the PayPal donate button.
# Note: Google Play policy; read docs/GO_LIVE.md ("PayPal donations") before turning this on for the Play build.
PAYPAL_DONATE_URL=
PRIVACY_POLICY_URL=https://amitpwa.github.io/hinterlay-privacy/
# Community sharing (Inspire > Share). false = entries are only saved on the phone. Turn on after the privacy policy covers uploads.
COMMUNITY_SHARING=false
